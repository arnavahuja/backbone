# 100% SPY, cross-checked against the CRSP value-weighted index (benchmark column).
name: B1 Market
data:
  source: yahoo
  dataset: daily
  frequency: 1mo
  instruments: [SPY]
  start: 2000-01-01
  end: 2025-12-31
strategy:
  name: fixed_weights
  params: {weights: {SPY: 1.0}}
costs:
  - name: bps_notional
    params: {bps: 2}
execution: {rebalance: every_bar, lag_bars: 1}
benchmark: wrds:crsp_index:CRSP_VW
factors: wrds:ff_factors
risk_free: wrds:ff_factors:rf
experiment: benchmarks
