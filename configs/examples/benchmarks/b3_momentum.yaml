# 12-2 momentum: return from t-12 to t-2, decile long-short, value-weighted.
name: B3 Momentum
strategy:
  name: trailing_return
  params: {lookback: 11, skip: 1, direction: high}
data:
  source: wrds
  dataset: crsp_monthly
  frequency: 1mo
  adjustment: raw            # raw prices for the $5 filter; returns come from CRSP ret
  start: 1999-01-01          # one year of warm-up before 2000
  end: 2025-12-31
  universe:
    name: market_cap_top_n
    params: {top_n: 1000, min_price: 5, source_universe: crsp_common}
  extra_datasets: [wrds:compustat_annual]
constructor:
  name: quantile_long_short
  params: {quantiles: 10, gross: 2.0, weighting: value, max_leg_weight: 0.05, min_names: 20}
costs:
  - name: bps_notional
    params: {bps: 10}
  - name: short_borrow_fee
    params: {annual_rate: 0.005}
execution: {rebalance: every_bar, lag_bars: 1}
benchmark: wrds:crsp_index:CRSP_VW
factors: wrds:ff_factors
risk_free: wrds:ff_factors:rf
experiment: benchmarks
