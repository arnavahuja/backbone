# 10-month SMA trend filter on five ETFs; a sleeve is in cash (T-bill) when below its SMA.
# GLD starts 2004-11, so the run starts in 2004 and trades from about 2005-09.
name: B8 Trend
data:
  source: yahoo
  dataset: daily
  frequency: 1mo
  instruments: [SPY, EFA, IEF, VNQ, GLD]
  start: 2004-01-01
  end: 2025-12-31
strategy:
  name: trend_filter
  params: {window: 10, weighting: all}
costs:
  - name: bps_notional
    params: {bps: 2}
execution: {rebalance: every_bar, lag_bars: 1}
benchmark: SPY
factors: wrds:ff_factors
risk_free: wrds:ff_factors:rf
experiment: benchmarks
