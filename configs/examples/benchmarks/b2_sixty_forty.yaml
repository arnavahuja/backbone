# 60% SPY / 40% IEF, rebalanced monthly. IEF starts 2002-07; before that its returns
# come from the CRSP 10-year constant-maturity Treasury series (crsp.mcti b10ret).
name: B2 60/40
data:
  source: yahoo
  dataset: daily
  frequency: 1mo
  instruments: [SPY, IEF]
  start: 2000-01-01
  end: 2025-12-31
  splices: ["IEF=wrds:crsp_treasury:B10RET"]
strategy:
  name: fixed_weights
  params: {weights: {SPY: 0.6, IEF: 0.4}}
costs:
  - name: bps_notional
    params: {bps: 2}
execution: {rebalance: every_bar, lag_bars: 1}
benchmark: SPY
factors: wrds:ff_factors
risk_free: wrds:ff_factors:rf
experiment: benchmarks
