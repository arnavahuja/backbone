# Offline example: SMA crossover on synthetic data (no network needed).
name: SMA crossover (synthetic)
data:
  source: synthetic
  dataset: gbm
  instruments: [AAA, BBB, CCC]
  start: 2015-01-01
  end: 2022-12-31
strategy:
  name: sma_crossover
  params: {fast: 20, slow: 100}
costs:
  - name: bps_notional
    params: {bps: 2}
slippage:
  name: half_spread
  params: {spread_bps: 4}
benchmark: SYN_MKT
execution:
  engine: vectorized
  lag_bars: 1
  price: close
experiment: examples
