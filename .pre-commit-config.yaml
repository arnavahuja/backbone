repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && pnpm exec eslint --max-warnings=0 src'
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && pnpm exec prettier --check src'
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: pytest-fast
        name: fast tests
        entry: python -m pytest -m "not live and not slow" -x -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
